name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm verify:package

      - run: pnpm verify:starters

      - run: pnpm check:exports

      - run: pnpm check:size

      - run: pnpm check:browser-entry

      - run: pnpm check:quick-example-size

      - run: pnpm test

      - run: pnpm bench:local:smoke
        if: github.event_name == 'workflow_dispatch'
