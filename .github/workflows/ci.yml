name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm check:template-types

      - run: pnpm verify:url-policy-codegen

      - run: pnpm verify:package

      - run: pnpm verify:clean-consumer

      - run: pnpm verify:starters

      - run: pnpm check:exports

      - run: pnpm check:size

      - run: pnpm check:browser-entry

      - run: pnpm check:browser-feature-budgets

      - run: pnpm check:runtime-sizes

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-feature-measurements
          path: benchmark/browser-feature-results/

      - run: pnpm check:client-bundle-attribution

      - run: pnpm check:quick-example-size

      - run: pnpm verify:whitespace-types

      - run: pnpm test

      - run: pnpm test:browser

      - run: pnpm bench:local:smoke
        if: github.event_name == 'workflow_dispatch'
