name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm build:create-package

      - run: pnpm test

      - run: pnpm verify:package

      - run: pnpm check:exports

      - run: pnpm check:size

      - run: pnpm verify:release --tag "$GITHUB_REF_NAME"

      - run: npm publish --dry-run --provenance --access public --tag "$NPM_TAG"

      - run: npm publish --dry-run --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/create-tachyon-dom

      - run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/create-tachyon-dom
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
