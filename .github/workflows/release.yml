name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: tachyon-dom-npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm verify:url-policy-codegen

      - run: pnpm build:create-package

      - run: pnpm test

      - run: pnpm verify:package

      - run: pnpm check:exports

      - run: pnpm check:size

      - run: pnpm verify:starters

      - run: pnpm check:browser-entry

      - run: pnpm check:browser-feature-budgets

      - run: pnpm check:quick-example-size

      - run: pnpm verify:whitespace-types

      - run: pnpm prepare:release --tag "$GITHUB_REF_NAME" --output release-artifacts

      - run: node scripts/release-contract.mjs --dry-run-artifacts release-artifacts --tag "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-artifacts

      - run: node scripts/release-contract.mjs --verify-artifacts release-artifacts --tag "$GITHUB_REF_NAME"

      - run: node scripts/preflight-release-publication.mjs --artifact-dir release-artifacts --tag "$GITHUB_REF_NAME"

      - run: node scripts/publish-release-package.mjs --artifact-dir release-artifacts --tag "$GITHUB_REF_NAME" --package root

      - run: node scripts/publish-release-package.mjs --artifact-dir release-artifacts --tag "$GITHUB_REF_NAME" --package create
