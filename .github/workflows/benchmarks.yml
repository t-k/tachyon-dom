name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-generated-template:
    name: Paired generated-template comparison
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_COMMIT: 83c55e0212adce7b7ba14d9d367234ac05aeef40
      HEAD_COMMIT: b566b551ea88d8c57d5c8e85564b59c04682788e
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install both subjects and Chromium
        shell: bash
        run: |
          corepack enable
          git worktree add --detach "$RUNNER_TEMP/lean-base" "$BASE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/lean-head" "$HEAD_COMMIT"
          pnpm --dir "$RUNNER_TEMP/lean-base" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/lean-head" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/lean-head" exec playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/lean-results"
      - name: Measure five base/head pairs on the same runner
        shell: bash
        run: |
          result_dir="$RUNNER_TEMP/lean-results"
          compare_args=()
          for pair in {1..5}; do
            if ((pair % 2 == 1)); then
              subjects=(base head)
            else
              subjects=(head base)
            fi
            for subject in "${subjects[@]}"; do
              printf 'Pair %s of 5, %s\n' "$pair" "$subject"
              pnpm --dir "$RUNNER_TEMP/lean-$subject" bench:template-browser -- \
                --iterations 3 --warmup 1 --item-count 1000 --child-count 2 \
                --output "$result_dir/$subject-$pair.json"
            done
            compare_args+=(--pair "$result_dir/base-$pair.json" "$result_dir/head-$pair.json")
          done
          pnpm --dir "$RUNNER_TEMP/lean-head" bench:template-browser:compare -- \
            "${compare_args[@]}" --output "$result_dir/comparison.json"
          printf 'Five clean paired runs compared %s with %s. The artifact contains the comparison and all ten measurements.\n' \
            "$BASE_COMMIT" "$HEAD_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: lean-followups-paired-${{ github.run_id }}
          path: ${{ runner.temp }}/lean-results
          if-no-files-found: warn
