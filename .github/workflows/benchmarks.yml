name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
        default: lean-mergeable

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: 83c55e0212adce7b7ba14d9d367234ac05aeef40
      CANDIDATE: 843757df48025ad94ab7e5e741205165ee8f7d4a
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - name: Build both commits
        run: |
          mkdir -p "$RUNNER_TEMP/lean-results"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE"
          for subject in base candidate; do
            pnpm --dir "$RUNNER_TEMP/$subject" install --frozen-lockfile
            pnpm --dir "$RUNNER_TEMP/$subject" build
          done
      - name: Compare browser bundle bytes
        run: |
          for subject in base candidate; do
            node benchmark/lean-mergeable.mjs "$RUNNER_TEMP/$subject" bundles > "$RUNNER_TEMP/lean-results/bundles-$subject.json"
          done
          diff -u "$RUNNER_TEMP/lean-results/bundles-base.json" "$RUNNER_TEMP/lean-results/bundles-candidate.json"
          pnpm --dir "$RUNNER_TEMP/base" exec playwright install --with-deps chromium
          for subject in base candidate; do
            pnpm --dir "$RUNNER_TEMP/$subject" bench:template-browser -- --iterations 1 --warmup 0 --item-count 1000 --child-count 2 --output "$RUNNER_TEMP/lean-results/browser-$subject.json"
            jq -S '.paths | map_values(.bundleSha256)' "$RUNNER_TEMP/lean-results/browser-$subject.json" > "$RUNNER_TEMP/lean-results/browser-bundles-$subject.json"
          done
          diff -u "$RUNNER_TEMP/lean-results/browser-bundles-base.json" "$RUNNER_TEMP/lean-results/browser-bundles-candidate.json"
      - name: Measure both commits on one runner
        run: |
          for pair in 1 2 3 4 5 6 7; do
            subjects=(base candidate)
            if ((pair % 2 == 0)); then subjects=(candidate base); fi
            for subject in "${subjects[@]}"; do
              node benchmark/lean-mergeable.mjs "$RUNNER_TEMP/$subject" > "$RUNNER_TEMP/lean-results/$subject-$pair.json"
            done
          done
          python3 benchmark/lean-mergeable-summary.py "$RUNNER_TEMP/lean-results" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: lean-mergeable-${{ github.run_id }}
          path: ${{ runner.temp }}/lean-results
