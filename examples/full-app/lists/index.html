<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tachyon DOM Full App Example</title>
    <link rel="stylesheet" href="../styles.css" />
    <script type="module" src="../main.ts"></script>
  </head>
  <body>
    <main id="app">
    <section class="app-shell" data-testid="app-shell" data-ssr-route="/lists/">
      <aside class="sidebar" aria-label="Primary">
        <a class="brand" href="/">Tachyon Full App</a>
        <nav class="nav-list" aria-label="Pages">
          <a href="/" data-nav>Overview</a>
          <a href="/counter/" data-nav>Counter</a>
          <a href="/lists/" data-nav aria-current="true">Lists</a>
          <a href="/forms/" data-nav>Forms</a>
          <a href="/compiler/" data-nav>Compiler</a>
          <a href="/settings/" data-nav>Settings</a>
        </nav>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Tachyon Full App</p>
            <h1 data-testid="route-title">Lists</h1>
          </div>
          <div class="summary-strip" aria-label="Summary">
            <span><b data-testid="summary-count">0</b> count</span>
            <span><b data-testid="summary-rows">3</b> rows</span>
            <span><b data-testid="summary-profile">Guest operator</b></span>
          </div>
        </header>
        <div id="route-outlet" class="route-outlet"><section class="page-grid">
  <article class="panel">
    <div class="toolbar">
      <button type="button" data-testid="add-row">Add row</button>
      <button type="button" data-testid="rotate-rows">Rotate rows</button>
      <button class="secondary" type="button" data-testid="toggle-open-only">Open only</button>
    </div>
    <ul class="row-list" data-testid="row-list">
      
        <li class="row-card" data-testid="row">
          <span class="row-status">open</span><strong data-testid="row-label">Compiler bindings</strong><small>Runtime</small>
        </li>
      
        <li class="row-card" data-testid="row">
          <span class="row-status">open</span><strong data-testid="row-label">Client router</strong><small>Router</small>
        </li>
      
        <li class="row-card is-done" data-testid="row">
          <span class="row-status">done</span><strong data-testid="row-label">Stream chunks</strong><small>Server</small>
        </li>
      
    </ul>
  </article>
  <article class="panel">
    <h2>Selection</h2>
    <p data-testid="row-mode">All rows</p>
  </article>
</section></div>
        <div id="route-live" class="visually-hidden" aria-live="polite"></div>
      </section>
    </section>
  </main>
  </body>
</html>
